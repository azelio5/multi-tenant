#      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
#      - PGADMIN_DEFAULT_PASSWORD=admin
#    ports:
#      - "9000:80"

volumes:
  postgres_data:
    driver: local

networks:
  saas-app-network:
    driver: bridge